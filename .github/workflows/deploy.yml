name: Deploy to AWS ECS

# Branch -> environment:
#   main    -> PRODUCTION (service lsat-backend-prod, ecs-task-def.prod.json,
#              /lsat-prep/prod/* secrets, DB lsat_prep_prod, Stripe LIVE,
#              api.scoreright.app)
#   staging -> STAGING    (service lsat-backend, ecs-task-def.json,
#              /lsat-prep/staging/* secrets, DB lsat_prep, Stripe SANDBOX,
#              lsat-api-staging.scottventures.com)
# Both run in the same ECS cluster (lsat-prep-staging).

on:
  push:
    branches: [main, staging]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lsat-prep-backend
  ECS_CLUSTER: lsat-prep-staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Gate the deploy on the code vetting, building, and passing tests.
      - name: Verify
        run: |
          go vet ./...
          go build ./...
          go test ./...

      - name: Select environment from branch
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "service=lsat-backend-prod" >> "$GITHUB_OUTPUT"
            echo "taskdef=ecs-task-def.prod.json" >> "$GITHUB_OUTPUT"
          else
            echo "service=lsat-backend" >> "$GITHUB_OUTPUT"
            echo "taskdef=ecs-task-def.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.env.outputs.taskdef }}
          container-name: lsat-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ steps.env.outputs.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
